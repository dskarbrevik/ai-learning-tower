[project]
name = "ai-learning-tower"
version = "0.1.0"
description = "Building a deep understanding of AI technologies from the ground up"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.5.0",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.4",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "scikit-learn>=1.8.0",
    "torch>=2.10.0",
    "transformers>=5.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_tower"
module-root = ""
